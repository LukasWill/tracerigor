site_name: TraceRigor
site_description: Train, verify, and analyze multi-turn agent trajectories.

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant

plugins:
  - search

nav:
  - Overview: index.md
  - Installation and workflows: run-exp.md
  - Configuration:
      - General: configs/general-config.md
      - Training algorithms: configs/algo-config.md
  - Environments:
      - Create an environment: envs/create-env.md
      - Create a service: envs/create-service.md
  - Reproducibility: reproduce-exp.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
