# Layer-0 heuristic thresholds
heuristics:
  min_trace_tokens: 8
  repeat_action_window: 3
  short_circuit_penalty: -0.20

# Reward mapping
reward:
  rubric_weights:
    observation_grounding: 0.35
    action_coherence: 0.40
    temporal_consistency: 0.25
  insufficient_evidence_penalty: 0.15
  reward_range: [-0.25, 0.25]
  lambda_proc: 0.10
  # Shaping modes (ported from service_llm_verifier_wrapper):
  #   default:    r_proc = clamp(2*r_raw - 1, lo, hi)
  #   symmetric:  delta = w_t * (2*score - 1), allows negative
  #   gate_mul:   multiplicative big/small reward splitting
  symmetric_shaping: false
  gate_mul: false
  big_threshold: 0.5
  alpha_big: 0.0
  beta_small: 0.0
  alpha_small: 0.0

# Training gating schedule
gating:
  enable_after_step: 0
  disable_after_step: -1
  run_every_k_steps: 1
  anneal_enabled: false
  anneal_start_step: 35
  anneal_end_step: 100
  anneal_hi_scale: 1.0
  anneal_lo_scale: 0.5

# Async audit queue
audit:
  enabled: true
  log_dir: judge_audit
  sample_rate: 0.02
  low_confidence_threshold: 0.65
  visual_confidence_threshold: 0.75
