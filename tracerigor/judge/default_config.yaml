# Judge Stack Configuration (default)
# Override in your training config or via JudgeConfig.from_dict()

enabled: true

# Rubrics to evaluate
rubrics:
  - observation_grounding
  - action_coherence
  - temporal_consistency

# Judge mode: "universal" (one call, all rubrics) or "per_rubric"
mode: universal

# How many recent turns to include in the judge prompt
history_k: 3

# Whether to send images to the judge (requires multimodal provider)
use_images: true

# Primary judge provider (synchronous, in training path)
provider:
  name: vllm-local
  base_url: "http://127.0.0.1:8001/v1"
  api_key: EMPTY
  model: gpt-oss-120b
  is_multimodal: false
  max_completion_tokens: 256
  temperature: 0.0
  timeout_s: 45.0
  max_retries: 1
  max_concurrency: 64
  use_structured_output: true
  use_responses_api: false

