name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Compile public Python sources
        run: python -m compileall -q tracerigor tests
      - name: Smoke-test the public analysis workflow
        run: |
          python -m tracerigor.cli analyze \
            examples/analysis/sample_records.jsonl \
            --group-by training_step
      - name: Check release hygiene
        shell: bash
        run: |
          forbidden=$(git ls-files \
            'analysis/**' \
            'paper/**' \
            '.public-cleanup-quarantine/**' \
            '.public-release/**' \
            '**/__pycache__/**' \
            '*.py[co]' \
            'build/**' \
            '*.egg-info/**')
          test -z "$forbidden"
          if git grep -I -n -E \
            'accessToken=|BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|/Users/[^/ ]+|/home/[^/ ]+' \
            -- . ':(exclude).github/workflows/ci.yml'; then
            echo 'Potential secret or machine-specific path found in tracked files.' >&2
            exit 1
          fi

  dataset-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dataset and environment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[data,envs]'
      - name: Generate the documented Blackjack seed datasets
        run: |
          tracerigor data examples/data/blackjack.yaml \
            --train-path /tmp/tracerigor-blackjack-train.parquet \
            --test-path /tmp/tracerigor-blackjack-test.parquet
