[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracerigor"
version = "0.1.0"
description = "Train multi-turn LLM agents with RLVR and audit whether their reasoning traces stay grounded, coherent, and consistent."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "TraceRigor contributors"},
]
keywords = ["rlvr", "reinforcement-learning", "llm-agents", "llm-as-a-judge", "reasoning", "faithfulness", "process-reward", "multi-turn", "vlm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scipy>=1.10",
  "seaborn>=0.13",
]
data = ["datasets>=2.18"]
envs = [
  "gym>=0.26",
  "gymnasium>=0.29",
  "gym-sokoban>=0.0.6",
  "matplotlib>=3.7",
  "pillow>=10",
  "scipy>=1.10",
  "together>=1.2",
]
judge = [
  "httpx>=0.27",
  "openai>=1.30",
]
train = [
  "codetiming>=1.4",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "ray>=2.10",
  "torch>=2.2",
  "transformers>=4.45",
  "wandb>=0.17",
]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/LukasWill/tracerigor"
Documentation = "https://github.com/LukasWill/tracerigor/tree/main/docs"
Issues = "https://github.com/LukasWill/tracerigor/issues"

[project.scripts]
tracerigor = "tracerigor.cli:main"

[tool.setuptools.packages.find]
include = ["tracerigor*"]

[tool.setuptools.package-data]
tracerigor = [
  "**/*.json",
  "**/*.yaml",
  "**/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = ["tests/manual"]
